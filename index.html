<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>F-stop timer</title>
<style>
/* ---------- the 1280x800 tablet screen (16:10): red on black ---------- */
#screen{position:absolute;left:0;top:0;width:1280px;height:750px;background:#000;color:var(--r5);font-family:'Roboto Condensed','sans-serif-condensed','Arial Narrow','Liberation Sans Narrow','DejaVu Sans Condensed',sans-serif;font-weight:500;overflow:hidden;transform-origin:0 0;transition:filter .35s;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#screen *{box-sizing:border-box}
:where(#screen) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#screen button:disabled{opacity:.3;cursor:not-allowed}
#screen button:focus-visible,#screen input:focus-visible,#screen select:focus-visible{outline:2px dashed var(--r5);outline-offset:4px}
:where(#screen) small{font-size:.42em;font-weight:500;margin-left:8px;color:var(--r4)}
.num{font-weight:700;font-variant-numeric:tabular-nums;line-height:.92;text-shadow:0 0 20px rgba(255,0,0,.38)}
.lbl{color:var(--r4);font-size:26px;margin:0 0 6px;line-height:1.1}
.muted{color:var(--r4)}
#segbar{position:absolute;left:0;right:0;top:0;height:18px;display:flex;gap:4px;padding:4px 4px 0}
.seg{flex:1;background:var(--r1);border-radius:2px;overflow:hidden;position:relative}
.seg i{display:block;height:100%;width:0;background:var(--r5)}
.seg.next{outline:1px solid var(--r5);outline-offset:-1px}
#status{position:absolute;left:0;right:0;top:18px;height:52px;display:flex;align-items:center;gap:20px;padding:0 18px;font-size:26px;border-bottom:1px solid var(--r2)}
.schip{min-width:155px;padding:4px 15px 2px;border:2px solid var(--r4);border-radius:8px;text-align:center;font-weight:700;font-size:29px}
.schip.exp{background:var(--r2);color:var(--o);border-color:var(--o)}
.schip.warn{border-style:dashed}
.gchip{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:3px 14px 2px;border:2px solid var(--r4);border-radius:8px;color:var(--r4);white-space:nowrap}
.gchip small{font-size:15px;font-weight:600;letter-spacing:.02em}
.gchip b{font-size:30px;font-weight:700;line-height:1.05}
.gchip:disabled{opacity:.35}
.about{margin:4px 0 0;font-size:21px;line-height:1.1;color:var(--r3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{flex:1;color:var(--r4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.hot{color:var(--r5)}
.ind{display:flex;align-items:center;gap:8px;color:var(--r3)}
.ind i{width:15px;height:15px;border-radius:50%;border:2px solid var(--r3)}
.ind.on{color:var(--r5)}
.ind.on i{background:var(--r5);border-color:var(--r5);box-shadow:0 0 10px var(--r5)}
#main{position:absolute;left:0;right:0;top:70px;height:600px;padding:18px 25px}
#nav{position:absolute;left:0;right:0;top:670px;height:80px;display:flex;border-top:1px solid var(--r2)}
#nav button{flex:1;min-width:0;padding:0;white-space:nowrap;font-size:24px;font-weight:600;color:var(--r4);border-right:1px solid var(--r1)}
#nav button:last-child{border-right:0}
#nav button.on{background:var(--r1);color:var(--o);box-shadow:inset 0 5px 0 var(--o)}
#nav.locked button{opacity:.3;pointer-events:none}
.banner{position:absolute;left:0;right:0;top:0;z-index:5;height:42px;background:var(--r2);color:var(--o);box-shadow:inset 0 -3px 0 var(--o);font-size:28px;font-weight:600;padding:6px 25px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner+div{margin-top:45px;height:calc(100% - 45px)}

.btn,.chip,.sq,.big,.tog,.go,.strip,.basev{border:2px solid var(--r4);border-radius:12px;display:flex;align-items:center;justify-content:center}
.btn.on{background:var(--r2)!important;color:var(--o)!important;border-color:var(--o)!important}
.btn.on small{color:var(--o)!important}
.sq{width:95px;height:95px;font-size:68px;font-weight:600;flex:none}
.sq.s{width:62px;height:58px;font-size:42px;border-radius:10px}
.chip{flex:1;height:65px;font-size:35px;font-weight:600;border-radius:10px;padding:0 8px}
.row{display:flex;gap:12px;margin-bottom:15px}
.big{flex:1;height:120px;flex-direction:column;font-size:82px;font-weight:600;border-radius:15px;line-height:.9}
.big small{font-size:28px;margin:0;color:var(--r4)}
.go{white-space:nowrap;height:115px;background:var(--r2);color:var(--o);border-color:var(--o);border-width:3px;font-size:70px;font-weight:700;border-radius:15px;width:100%}
.tog{flex:1;height:65px;font-size:31px;font-weight:600;border-radius:10px}

/* time view */
.time{display:grid;grid-template-columns:690px 1fr;gap:38px;height:100%}
.baserow{display:flex;align-items:center;gap:15px;margin-bottom:15px}
.basev{flex:1;height:95px;border-color:var(--r2);align-items:baseline;padding-top:8px}
.basev .num{font-size:92px}
.basev small{font-size:38px}
.tr{display:flex;flex-direction:column;gap:12px;min-width:0}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:10px;border:2px solid var(--r3);border-radius:15px;padding:12px 18px 10px;height:185px}
.readout .num{font-size:95px;white-space:nowrap}
.readout.sm{height:auto;padding:10px 15px;margin-bottom:12px}
.readout.sm .num{font-size:65px}
.note{color:var(--r4);font-size:25px;margin-top:-4px}
.bright{display:flex;align-items:center;gap:15px;height:45px}
.bright input{flex:1}
#screen input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:38px;margin:0;color:var(--r4)}
#screen input[type=range]::-webkit-slider-runnable-track{height:10px;background:var(--r2);border-radius:5px}
#screen input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:35px;height:35px;margin-top:-10px;border-radius:50%;background:var(--r5);border:2px solid #000}
#screen input[type=range]::-moz-range-track{height:10px;background:var(--r2);border-radius:5px}
#screen input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--r5);border:2px solid #000}
#screen input[type=range]:disabled{opacity:.35}
.bright #focusrem{min-width:138px;text-align:right}

/* strip view */
.stripwrap{display:grid;grid-template-columns:775px 1fr;gap:32px;height:100%}
.strips{display:flex;gap:10px;margin-bottom:15px}
.strip{flex:1;height:172px;flex-direction:column;justify-content:space-between;padding:10px 5px;border-radius:10px}
.strip .sn{font-size:30px;color:var(--r4)}
.strip .sv{font-size:38px;white-space:nowrap}
.strip .st{font-size:29px;color:var(--r5)}
.strip.sel{border-width:5px;border-color:var(--r5)}
.tbl{display:grid;grid-template-columns:88px 1fr 1fr 1fr;font-size:29px}
.tbl>div{padding:4px 10px;border-bottom:1px solid var(--r1);line-height:1.15}
.tbl .h{color:var(--r4)}
.rcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.rcol>.btn,.rcol>.row,.rcol>.mini,.rcol>.saved{flex:none}
.rcol .chip{min-width:0;padding:0}
.go.sm{font-size:52px}
.mini{display:flex;align-items:center;gap:12px}
.mini .basev{height:80px}
.mini .basev .num{font-size:62px}
.mini .basev small{font-size:30px}
.stp{display:flex;align-items:center;gap:10px}
.stp .sv{min-width:102px;text-align:center;font-size:38px;font-weight:600}

/* recipe view */
.recwrap{display:grid;grid-template-columns:762px 1fr;gap:32px;height:100%}
.list{height:360px;overflow-y:auto;padding-right:8px;margin-bottom:10px}
.entry{display:flex;align-items:center;gap:15px;height:70px;border:2px solid var(--r2);border-radius:10px;padding:0 10px;margin-bottom:10px}
.badge{width:98px;text-align:center;border:2px solid var(--r4);border-radius:8px;font-size:28px;font-weight:600;padding:2px 0}
.badge.dodge{border-style:dashed}
.es{font-size:48px;width:130px}
.et{flex:1;font-size:32px}
.empty{color:var(--r4);font-size:32px;line-height:1.25;padding:25px 5px;max-width:650px}
.saved{display:flex;flex-wrap:wrap;gap:10px}
.saved .chip{flex:none;height:55px;font-size:29px;padding:0 15px}
.saved .x{width:55px;flex:none}

/* log, scale, settings */
.logv{height:100%}
.lhead,.lrow{display:grid;grid-template-columns:120px 135px 1fr 312px;gap:12px;align-items:center;padding:5px 8px;font-size:29px}
.lhead{color:var(--r4);border-bottom:1px solid var(--r2)}
.lrow{border-bottom:1px solid var(--r1);min-height:62px}
.lrow input,.scv input,.scv select{background:#000;color:var(--r5);border:2px solid var(--r3);border-radius:8px;font:inherit;font-size:30px;padding:5px 10px;width:100%;min-width:0}
.lrow input::placeholder{color:var(--r3)}
.loglist{height:415px;overflow-y:auto}
.scv{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.szrow{display:grid;grid-template-columns:188px 1fr 32px 1fr;gap:12px;align-items:center;margin-bottom:18px}
.szrow .cap{font-size:32px;grid-row:span 2}
.scv select{grid-column:2 / 5;margin-bottom:0}
.scres{border:2px solid var(--r3);border-radius:15px;padding:20px 22px}
.scres .num{font-size:88px}
.setv{display:grid;grid-template-columns:1fr 1fr;gap:8px 45px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:15px;min-height:75px;border-bottom:1px solid var(--r1);font-size:31px;line-height:1.1}
.srow small{display:block;margin:2px 0 0;font-size:24px;color:var(--r4)}
.srow .tog{flex:none;width:130px;height:55px}

/* run view */
.run{display:grid;grid-template-columns:1fr 425px;grid-template-rows:minmax(0,1fr);gap:28px;height:100%}
.rl{display:flex;flex-direction:column;min-width:0;min-height:0}
.rtitle{font-size:38px;color:var(--r4)}
.cdbox{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
.cd{font-size:268px;line-height:.86;letter-spacing:-2px}
.cd.stale{opacity:.45}
.cdcap{font-size:32px;color:var(--r4);margin-top:5px}
.pr1{font-size:38px;font-weight:600}
.pr2{font-size:55px;font-weight:700;line-height:1.05;min-height:58px}
.runbtns{display:flex;gap:18px;margin-top:15px}
.runbtns .go{height:95px;font-size:58px;flex:1}
.runbtns .tog2{flex:1;height:95px;font-size:55px;font-weight:700;border:2px solid var(--r4);border-radius:15px}
.rr{min-width:0}
.mstrips{display:flex;gap:8px;margin-bottom:12px}
.mstrip{flex:1;height:118px;border:2px solid var(--r4);border-radius:8px;display:flex;align-items:flex-start;justify-content:center;font-size:32px;padding-top:5px}
.mstrip.cov{background:transparent;border-style:dashed;border-color:var(--r2);color:var(--r3)}
.mstrip.lit{background:rgba(255,0,0,.32)}
.steps{margin-bottom:10px}
.stpl{display:flex;justify-content:space-between;font-size:30px;padding:4px 10px;border-bottom:1px solid var(--r1)}
.stpl.done{color:var(--r3);text-decoration:line-through}
.stpl.cur{background:var(--r2);color:var(--o)}
.cues{border:2px solid var(--r3);border-radius:10px;padding:8px 12px;margin-top:8px}
.cue{display:flex;justify-content:space-between;font-size:30px;padding:2px 0}
.cue.hold{color:var(--o);background:var(--r2);margin:0 -6px;padding:2px 8px;border-radius:5px}

/* overlay keypad */
#overlay{position:absolute;inset:0;z-index:20}
#overlay:empty{display:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center}
.kp{width:475px;border:2px solid var(--r4);border-radius:18px;background:#000;padding:20px}
.kpd{border:2px solid var(--r3);border-radius:10px;text-align:right;padding:8px 18px;margin-bottom:15px;font-size:80px;height:105px}
.kpg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpg button{height:80px;font-size:48px;font-weight:600;border:2px solid var(--r4);border-radius:10px}
.kpg .ok{background:var(--r2);color:var(--o);border-color:var(--o)}


/* ---- tablet layout: 16:10 canvas, flex column app ---- */
#screen{width:1280px;height:800px}
#app{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;transition:filter .35s}
#segbar{position:relative;left:auto;right:auto;top:auto;flex:none;height:18px;padding:4px 4px 0}
#status{position:relative;left:auto;right:auto;top:auto;flex:none;height:54px;padding:0 20px;font-size:26px}
#main{position:relative;left:auto;right:auto;top:auto;flex:1;min-height:0;height:auto;padding:20px 32px}
#nav{position:relative;left:auto;right:auto;top:auto;flex:none;height:80px}
.banner{height:44px;padding:6px 32px;padding-right:250px;font-size:27px;line-height:1.25}
.banner+div{margin-top:46px;height:calc(100% - 46px)}
.bbtn{position:absolute;right:16px;top:5px;height:34px;padding:0 24px;border:3px solid var(--o);border-radius:8px;font-size:26px;font-weight:700;color:var(--o);background:transparent;line-height:1}
#overlay{z-index:50}
.time .lbl{font-size:26px;margin-bottom:6px}
.time .baserow{gap:16px;margin-bottom:14px}
.time .sq{width:96px;height:96px;font-size:70px}
.time .basev{height:96px}
.time .basev .num{font-size:96px}
.time .row{margin-bottom:14px}
.time .chip{height:68px;font-size:36px}
.time .tr .chip{height:62px;font-size:29px}
.time .big{height:130px;font-size:84px}
.time .big small{font-size:28px}
.time .tr{gap:12px}
.time .readout{height:190px}
.time .readout .num{font-size:100px}
.time .go{height:112px;font-size:70px}
.time .tog{height:64px;font-size:30px}
.time .bright{height:48px}
.tbl>div{padding:6px 12px}
.strips .strip{height:190px}
.stripwrap .go{height:120px}
.stripwrap .chip{height:70px}
.list{height:390px}
.loglist{height:420px}
.srow{min-height:82px;font-size:31px}
.srow small{font-size:23px}
.setv{gap:10px 52px}
.scv .cap{font-size:32px}
.scv input,.scv select{font-size:30px;padding:8px 12px}
.szrow{margin-bottom:24px}
.scres{padding:26px 32px}
.scres .num{font-size:100px}


.dev{display:grid;grid-template-columns:560px minmax(0,1fr);gap:30px;height:100%}
.dev>div{min-width:0}
.dev .lbl{font-size:26px;margin-bottom:2px}
.dtemp{display:flex;align-items:baseline;gap:10px}.dtemp .num{font-size:110px;line-height:1.05}.dtu{font-size:40px;color:var(--r4)}
.dev .note{font-size:22px;min-height:50px;margin:0 0 6px}
.dev .note#dvmsg{min-height:28px;margin:0 0 2px}
.dev .lbl.sm{font-size:22px;margin:6px 0 2px}
.drow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;border-bottom:1px solid var(--r1);font-size:29px;line-height:1.05}
.drow small{display:block;font-size:19px;color:var(--r4);margin-top:2px}
.drow .tog{flex:none;width:92px;height:52px;font-size:28px}
.drow .stp .sv{min-width:96px;font-size:34px}
.dcd{font-size:104px;line-height:1.02}
.dvbar{height:14px;background:var(--r2);border-radius:7px;overflow:hidden;margin:2px 0 6px}.dvbar i{display:block;height:100%;width:0;background:var(--o)}
.dvlist{margin:4px 0 6px}.dvl{display:flex;justify-content:space-between;font-size:25px;padding:1px 10px;border-radius:6px;color:var(--r3)}
.dvl.cur{background:var(--r2);color:var(--o);font-weight:700}.dvl.done{color:var(--r3);text-decoration:line-through}
.dev .chip{height:56px;font-size:24px;white-space:nowrap;flex:1;min-width:0;padding:0 4px}
.dev .go.sm{flex:1;height:64px;font-size:38px}
/* ---- print and calibration views ---- */
.prt{display:grid;grid-template-columns:600px 1fr;gap:32px;height:100%}
.prt .lbl{font-size:26px}
.vrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.vrow .name{flex:1;font-size:27px;line-height:1.05}
.vrow .val{min-width:120px;text-align:center;font-size:40px}
.vrow .how{font-size:21px;line-height:1.05;color:var(--r4);min-width:120px}
.prt .readout{height:auto;padding:8px 16px 6px;margin-bottom:10px}
.prt .readout .num{font-size:66px}
.prt .chip{font-size:30px;white-space:nowrap;height:62px;padding:0 6px}
.prt .go.sm{height:76px;font-size:44px}
.prt .note{font-size:21px;margin-top:6px}
.tscale{position:relative;margin-top:10px}
.tmrow{position:relative;height:50px}
.tm{position:absolute;bottom:2px;transform:translateX(-50%);font-size:30px;padding:2px 14px;border:2px solid var(--r5);border-radius:8px;background:#000;color:var(--r5)}
.tm.edge{opacity:.55;border-style:dashed}
.tbar{display:flex;border:2px solid var(--r3);height:100px}
.tcell{flex:1;display:block}
.tlabs{position:relative;height:44px}
.tlab{position:absolute;top:10px;transform:translateX(-50%);font-size:23px;color:var(--r4);white-space:nowrap}
.tlab::before{content:'';position:absolute;left:50%;top:-10px;height:10px;border-left:2px solid var(--r4)}
.tsum{font-size:25px;line-height:1.25;margin-top:2px}
.cal{height:100%}
.cal .lbl{font-size:27px;margin:0}
.calhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.calhead .chip{height:54px;font-size:27px;padding:0 20px;white-space:nowrap}
.calchips{display:flex;gap:6px;margin-bottom:4px}
.calchips .chip{flex:1;min-width:0;height:54px;font-size:26px;padding:0 2px}
.calres{font-size:22px;margin:2px 0 4px;min-height:28px}
.calstep{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;border-top:1px solid var(--r1);padding:6px 0}
.calstep .t{font-size:23px;line-height:1.15}
.calstep .t b{font-size:25px}
.pchip{flex:none;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;width:215px;padding:3px 8px;border:2px solid var(--r4);border-radius:8px;color:var(--r4);font-size:18px;font-weight:700;line-height:1.1;text-align:center;white-space:normal}
.pchip:disabled{opacity:.35}
.ppick{flex-direction:column;align-items:flex-start;justify-content:center;width:100%;height:64px;padding:2px 14px;text-align:left;line-height:1.05;margin-bottom:6px}
.ppick small{font-size:19px;color:var(--r3);margin:0}
.ppick b{font-size:24px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paprow{display:flex;gap:8px;margin-bottom:6px}
.paprow .ppick{flex:1;min-width:0;width:auto;height:60px;margin:0}
.paprow .ppick b{font-size:26px}
.paprow .chip{flex:none;height:60px;font-size:26px;padding:0 16px;white-space:nowrap}
.ppbox{width:1180px;max-height:720px;border:2px solid var(--r4);border-radius:18px;background:#000;padding:14px 20px;display:flex;flex-direction:column;gap:10px}
.pph{font-size:30px;color:var(--r4)}
.pplist{overflow-y:auto;max-height:470px;display:flex;flex-direction:column;gap:8px}
.plrow{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:64px;padding:4px 16px;font-size:30px;text-align:left;flex:none}
.plrow .pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plrow .pm{flex:none;font-size:22px;color:var(--r4)}
.plrow.on .pm{color:var(--o)}
.ppcols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ppopts .lbl{font-size:24px;margin:8px 0 4px}
.ppopts .chip{flex:none;height:54px;font-size:26px;padding:0 14px}
.ppprev,.ppmsg{font-size:26px;margin-top:12px}
.ppmsg{font-size:34px;color:var(--r5)}
.ppbox .chip{height:62px;font-size:30px}

/* ================= exposure maths ================= */

const mainNom = () => mainNomRaw() * compF();
const mainAct = () => Rcp(mainNom());
const ivN = () => IV[A.iv].n;

}

    case 'calclear': delete A.cal.data[KEY_P(A.cal.grade)]; delete A.profile.grades[KEY_P(A.cal.grade)]; toast('Grade ' + gradeLabel(A.cal.grade) + ' cleared'); changed(); break;
    case 'dvstep': { const def = DEVDEF[a], st = typeof def.step === 'function' ? def.step(A.dev[a], +b) : def.step; A.dev[a] = clamp(A.dev[a] + (+b) * st, def.min, def.max); changed(); break; }
    case 'dvwash': A.dev.wash = !A.dev.wash; changed(); break;
    case 'dvpd': A.dev.devSec = +a; changed(); break;
    case 'dvpf': A.dev.fixSec = +a; changed(); break;
    case 'dvps': A.dev.stopSec = +a; changed(); break;
    case 'dvpw': A.dev.washSec = +a; A.dev.wash = true; changed(); break;
    case 'dvmaker': { const pre = paperPreset(activePaper().preset); if (pre) { Object.assign(A.dev, pre.dev); toast('Maker\u2019s times set. ' + pre.note, 7000); changed(); } break; }
    case 'dvstart': devStart(); break;
    case 'dvpause': devPause(); break;
    case 'dvskip': devSkip(); break;
    case 'dvreset': U.dev = null; renderAll(); break;
    case 'mclear': A.meter.ref = A.meter.hi = A.meter.lo = null; save(); toast('Readings cleared'); renderMainView(); break;
    case 'base': A.baseT = clamp(A.baseT + (+a) * 5, 5, 9999); changed(); break;
    case 'preset': A.baseT = +a * 10; changed(); break;
    case 'keypad': U.keypad = { buf: '' }; renderOverlay(); break;
    case 'kp': keypad(a); break;
    case 'iv': A.iv = +a; changed(); break;
    case 'off': A.off = clamp(A.off + (+a) * ivN(), -60, 60); changed(); break;
    case 'off0': A.off = 0; changed(); break;
    case 'setbase': A.baseT = clamp(Math.round(mainNomRaw() * 10), 5, 9999); A.off = 0; toast('Base time set to ' + (A.baseT / 10).toFixed(1) + ' s'); changed(); break;
    case 'start': doStart(); break;
    case 'pause': toRelay('PAUSE'); break;
    case 'resume': toRelay('RESUME'); break;
    case 'cancel': toRelay('CANCEL'); break;
    case 'focus': toRelay('FOCUS', { on: R.state !== 'FOCUS' }); break;
    case 'safe': toRelay('SAFELIGHT', { on: !R.safeUser }); break;
    case 'strip': U.selStrip = U.selStrip === +a ? null : +a; renderMainView(); break;
    case 'usestrip': if (U.selStrip) { A.off = (6 - U.selStrip) * ivN(); A.tab = 'time'; toast('Exposure set to ' + fmtStops(A.off) + ' stops from strip ' + U.selStrip); changed(); } break;
    case 'addburn': case 'adddodge': A.recipe.push({ id: ++A.rid, type: name === 'addburn' ? 'burn' : 'dodge', n: ivN() }); if (A.recipe.length > 8) A.recipe.shift(); changed(); break;
    case 'rn': { const e = A.recipe.find(x => String(x.id) === a); if (e) { e.n = clamp(e.n + (+b) * ivN(), 1, 48); changed(); } break; }
    case 'rdel': A.recipe = A.recipe.filter(x => String(x.id) !== a); changed(); break;
    case 'rsave': A.saved.push({ id: ++A.rid, name: 'Recipe ' + (A.saved.length + 1), baseT: A.baseT, off: A.off, iv: A.iv, recipe: JSON.parse(JSON.stringify(A.recipe)) }); if (A.saved.length > 6) A.saved.shift(); toast('Recipe saved'); changed(); break;
    case 'rload': { const s = A.saved.find(x => String(x.id) === a); if (s) { A.baseT = s.baseT; A.off = s.off; A.iv = s.iv; A.recipe = JSON.parse(JSON.stringify(s.recipe)); A.recipe.forEach(x => { x.id = ++A.rid; }); toast('Loaded ' + s.name); changed(); } break; }
    case 'rdelsaved': A.saved = A.saved.filter(x => String(x.id) !== a); changed(); break;
    case 'logclear': A.log = []; changed(); break;
    case 'applyscale': { const s = A.scale; const st = Math.log2((s.bw * s.bh) / (s.aw * s.ah)); A.baseT = clamp(Math.round((A.baseT / 10) * Math.pow(2, st) * 10), 5, 9999); A.scale.aw = s.bw; A.scale.ah = s.bh; toast('Base time is now ' + (A.baseT / 10).toFixed(1) + ' s'); changed(); break; }
    case 'set': {
      const k = d.key, dir = +d.dir, def = SETDEF[k]; let v = A.set[k];
      if (def.opts) v = def.opts[clamp(def.opts.indexOf(v) + dir, 0, def.opts.length - 1)];
      else v = clamp(Math.round((v + dir * def.step) * 100) / 100, def.min, def.max);
      A.set[k] = v; pushConfig(); changed(); break;
    }
    case 'toggle': A.set[d.key] = !A.set[d.key]; pushConfig(); changed(); break;
  }
}
function keypad(k) {
  const p = U.keypad; if (!p) return;
  if (k === 'cancel') U.keypad = null;
  else if (k === 'back') p.buf = p.buf.slice(0, -1);
  else if (k === 'ok') {
    const v = parseFloat(p.buf);
    if (v >= 0.5 && v <= 999.9) { A.baseT = Math.round(v * 10); U.keypad = null; changed(); return; }
    toast('Enter a time from 0.5 to 999.9 s', 3000, true);
  }
  else if (k === '.') { if (!p.buf.includes('.')) p.buf += p.buf ? '.' : '0.'; }
  else if (/^\d$/.test(k)) { if (p.buf.replace('.', '').length < 5 && !/\.\d$/.test(p.buf)) p.buf += k; }
  renderOverlay();
}
function doStart() {
  if (!U.linkOk) return;
  syncArm(true); toRelay('START');
}


/* ================= live updates every frame ================= */
function renderLive() {
  devFrame();
  const now = perf();
  const cd = $('#cd');
  if (cd) { cd.textContent = (U.linkOk ? '' : '~') + (remEst() / 1000).toFixed(1); cd.classList.toggle('stale', !U.linkOk); }
  // segment bar
  const segs = $$('#segbar .seg');
  if (segs.length) {
    const st = R.state === 'PAUSED' ? R.pf : R.state, r = remEst();
    segs.forEach((sg, i) => {
      let f = 0, nx = false;
      if (running(R.state)) {
        if (st === 'EXPOSING') { if (i < R.idx) f = 100; else if (i === R.idx) f = R.total ? (1 - r / R.total) * 100 : 0; }
        else if (st === 'GAP') { if (i <= R.idx) f = 100; if (i === R.idx + 1) nx = true; }
      }
      sg.firstChild.style.width = clamp(f, 0, 100) + '%'; sg.classList.toggle('next', nx);
    });
  }
  // dodge cues
  $$('.cue').forEach(c => {
    const hold = +c.dataset.hold, el = R.total - remEst(), cs = c.querySelector('.cs');
    const holding = R.state === 'EXPOSING' && el < hold;
    c.classList.toggle('hold', holding);
    cs.textContent = holding ? 'Hold, ' + ((hold - el) / 1000).toFixed(1) + ' s left' : 'Release';
  });
  const fr = $('#focusrem');
  if (fr) fr.textContent = R.state === 'FOCUS' && R.focusRem != null ? 'Off in ' + Math.floor(R.focusRem / 60000) + ':' + String(Math.floor(R.focusRem / 1000) % 60).padStart(2, '0') : '';
  if (R.metering && now - Mt.rxAt > 1200 && A.tab === 'meter' && now - (U.meterTick || 0) > 400) { U.meterTick = now; updateMeterLive(); }
  if (U.toast && now > U.toast.until) { U.toast = null; }
  updateToast();

}


/* ================= layout: fit the 16:10 screen to the window ================= */
function fit() {
  const W = window.innerWidth, H = window.innerHeight, s = Math.min(W / 1280, H / 800);
  const x = (W - 1280 * s) / 2, y = (H - 800 * s) / 2;
  screen.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
}
window.addEventListener('resize', fit);
document.addEventListener('fullscreenchange', () => { fit(); if (U.panel) renderOverlay(); });

/* ================= timers and boot ================= */
setInterval(() => { if (Ble.connected) toRelay('PING'); }, 500);
setInterval(() => {
  if (U.zero && perf() - U.zero.t > 10000) { U.zero = null; toRelay('METER', { mode: 0 }); toast('Could not read a steady dark offset', 6000, true); renderAll(); }
  if (U.linkOk && perf() - U.rxAt > 1000) { U.linkOk = false; mlog('App', 'no status from the relay: link lost'); renderAll(); }
}, 250);
(function frame() { renderLive(); requestAnimationFrame(frame); })();

window.__fstopMeter = { netLux, stopsBetween, logDensity };
window.__fstopPrint = { PAPER_LIST, importFile, GRADES, gradeDoses, printTime, tonePos, toneLevel, toneModeFor, toneColor, calcGrade, mergeProfile, buildPlan, mainNom, fwWarning, devTimeFor, fmtMS, devDebug: () => ({ tempOn: U.tempOn, tp: Tp, dev: U.dev && { idx: U.dev.idx, state: U.dev.state } }) };      // for the tests
/* ================= splash ================= */
{ const sp = document.getElementById('splash');
  if (sp) { const hideSplash = () => { if (!sp.classList.contains('out')) { sp.classList.add('out'); setTimeout(() => sp.remove(), 600); } };
    sp.addEventListener('click', hideSplash); setTimeout(hideSplash, 2600); } }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => { U.persisted = ok; }).catch(() => {});      // ask the browser not to clear the profile
mlog('App', 'started; last settings restored');
renderAll(); fit(); wake();
(async () => {
  try {
    if (Ble.supported && navigator.bluetooth.getDevices) {          // remembered relay: reconnect without the pairing list
      const ds = await navigator.bluetooth.getDevices();
      const d = ds.find(x => /^FStop/.test(x.name || '')) || ds[0];
      if (d) { Ble.attach(d); Ble.want = true; Ble.connect(); }
    }
  } catch (e) { /* not available */ }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

})();
</script>
